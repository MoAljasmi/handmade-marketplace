<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Hirfa</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page">
        <div class="page-head">
            <h1>Your cart</h1>
        </div>

        <div class="cart-layout">
            <section id="cart-items" class="cart-items" aria-label="Cart items" aria-live="polite"></section>

            <aside id="cart-summary" class="card cart-summary" aria-labelledby="summary-title" hidden>
                <h2 id="summary-title">Order summary</h2>
                <div id="cart-totals"></div>
                <a href="checkout.html" id="checkout-btn" class="btn btn--large btn--block">Proceed to checkout</a>
                <a href="products.html" class="text-link center">Continue shopping</a>
            </aside>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
