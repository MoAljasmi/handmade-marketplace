<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Handmade Products | Hirfa</title>
    <meta name="description" content="Search and filter handmade jewelry, decorations, candles, accessories and gifts by price, category and rating.">
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page">
        <div class="page-head">
            <h1>Shop handmade</h1>
            <p class="muted">Search by keywords, then narrow down by category, price, rating and availability.</p>
        </div>

        <div class="presets" aria-label="Quick searches">
            <span class="muted">Quick search:</span>
            <button type="button" class="chip" data-preset="under100">In stock under AED 100</button>
            <button type="button" class="chip" data-preset="toprated">Rated 4+ stars</button>
            <button type="button" class="chip" data-preset="gifts">Gifts under AED 150</button>
            <button type="button" class="chip" data-preset="newest">New arrivals</button>
        </div>

        <div class="shop-layout">
            <aside class="filters" aria-label="Filters">
                <form id="filters" role="search">
                    <div class="field">
                        <label for="q">Keywords</label>
                        <input type="search" id="q" name="q" placeholder="e.g. silver ring" autocomplete="off">
                        <p class="hint">Use several words to narrow the search.</p>
                    </div>

                    <div class="field">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="">All categories</option>
                        </select>
                    </div>

                    <fieldset class="field">
                        <legend>Price (AED)</legend>
                        <div class="field-row">
                            <label class="sr-only" for="min">Minimum price</label>
                            <input type="number" id="min" name="min" min="0" step="1" placeholder="Min" inputmode="numeric">
                            <span aria-hidden="true">&ndash;</span>
                            <label class="sr-only" for="max">Maximum price</label>
                            <input type="number" id="max" name="max" min="0" step="1" placeholder="Max" inputmode="numeric">
                        </div>
                        <div id="price-error" class="alert" hidden></div>
                    </fieldset>

                    <div class="field">
                        <label for="rating">Customer rating</label>
                        <select id="rating" name="rating">
                            <option value="">Any rating</option>
                            <option value="4">4 stars &amp; up</option>
                            <option value="3">3 stars &amp; up</option>
                            <option value="2">2 stars &amp; up</option>
                        </select>
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" id="inStock" name="inStock">
                        <span>In stock only</span>
                    </label>

                    <div class="field">
                        <label for="sort">Sort by</label>
                        <select id="sort" name="sort">
                            <option value="featured">Featured</option>
                            <option value="price_asc">Price: low to high</option>
                            <option value="price_desc">Price: high to low</option>
                            <option value="rating">Top rated</option>
                            <option value="newest">Newest</option>
                            <option value="name">Name A&ndash;Z</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn">Search</button>
                        <button type="button" class="btn btn--ghost" id="clear-filters">Clear</button>
                    </div>
                </form>
            </aside>

            <section aria-labelledby="result-count">
                <div class="results-bar">
                    <p id="result-count" class="results-count" aria-live="polite"></p>
                    <button type="button" class="btn btn--ghost btn--small filters-toggle" id="toggle-filters" aria-expanded="false">Filters</button>
                </div>
                <div id="product-grid" class="product-grid product-grid--3"></div>
            </section>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
