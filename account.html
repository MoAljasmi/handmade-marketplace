<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Hirfa</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page">
        <div class="page-head">
            <h1>Hello, <span id="welcome-name">there</span></h1>
            <p class="muted">Your orders and saved delivery details.</p>
        </div>

        <div class="account-layout">
            <section id="orders" aria-labelledby="orders-title">
                <h2 id="orders-title">My orders</h2>
                <div id="order-list" class="order-list" aria-live="polite">
                    <p class="muted">Loading orders...</p>
                </div>
            </section>

            <aside aria-labelledby="profile-title">
                <form id="profile-form" class="card form" novalidate>
                    <h2 id="profile-title">My details</h2>
                    <div class="field">
                        <label for="fullName">Full name</label>
                        <input type="text" id="fullName" name="fullName" autocomplete="name" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" readonly aria-describedby="email-hint">
                        <p id="email-hint" class="hint">Your e-mail is used to log in and cannot be changed here.</p>
                    </div>
                    <div class="field">
                        <label for="phone">Mobile number</label>
                        <input type="tel" id="phone" name="phone" autocomplete="tel">
                    </div>
                    <div class="field">
                        <label for="city">Emirate</label>
                        <select id="city" name="city">
                            <option value="">Not set</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" maxlength="300" autocomplete="street-address"></textarea>
                    </div>
                    <div id="profile-message" class="alert" hidden></div>
                    <button type="submit" class="btn btn--block">Save details</button>
                </form>
            </aside>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
