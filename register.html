<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Hirfa</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container page auth-page">
        <div class="card auth-card">
            <h1>Create your account</h1>
            <p class="muted">Save your details, follow your orders and review the pieces you buy.</p>

            <form id="register-form" class="form" novalidate>
                <div class="field">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" name="fullName" autocomplete="name" required minlength="3" maxlength="100">
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="phone">Mobile number (optional)</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="050 123 4567">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" aria-describedby="password-hint">
                        <button type="button" class="link-button" data-toggle-password="password" aria-pressed="false">Show</button>
                    </div>
                    <p id="password-hint" class="hint">At least 8 characters with letters and numbers.</p>
                </div>
                <div class="field">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
                </div>
                <label class="checkbox">
                    <input type="checkbox" id="terms" name="terms">
                    <span>I agree to the <a href="about.html#privacy" target="_blank" rel="noopener">privacy policy</a>.</span>
                </label>
                <div id="form-message" class="alert" hidden></div>
                <button type="submit" class="btn btn--large btn--block">Create account</button>
            </form>

            <p class="center">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
